[project]
name = "bithumb_bot"
version = "0.1.0"
description = "Bithumb KRW spot single-asset long-or-cash trading bot — safety-first, execution-honest, clean-room rebuild"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "renardtoucan", email = "renardtoucan@gmail.com" }]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings",
    "httpx>=0.27",
    "websockets>=16.0",
    "PyJWT>=2.9",
    "structlog>=24",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis",
    "pytest-cov",
    "ruff",
    "mypy",
    "import-linter",
    "pre-commit",
]

# ---------------------------------------------------------------------------
# Console scripts (D-85 / D-99)
#
# The single `bt` console script binds to `bithumb_bot.cli.main:main` — the
# dispatcher that validates every capability against `validate()` before
# invoking any handler. There is deliberately ONE console script; no
# per-verb entry points exist. Reserved verbs (D-87) refuse uniformly.
# ---------------------------------------------------------------------------
[project.scripts]
bt = "bithumb_bot.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bithumb_bot"]

# ---------------------------------------------------------------------------
# Tool: pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error",
]

# ---------------------------------------------------------------------------
# Tool: ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF", "PL", "C4",
]
ignore = [
    "E501",  # line-length is enforced by ruff format
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Tool: mypy (strict)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["bithumb_bot"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tool: Import Linter (D-71)
#
# The root_package + exclude_type_checking_imports were placed by plan 01-01.
# The forbidden `core → broker` contract was added by plan 01-03 task 01-03-01.
# `source_modules` and `forbidden_modules` are TOML arrays (Finding 1):
# INI-style whitespace-separated strings do NOT work in the TOML config.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "bithumb_bot"
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
name = "Core must not import broker"
type = "forbidden"
source_modules = ["bithumb_bot.core"]
forbidden_modules = ["bithumb_bot.broker"]

[[tool.importlinter.contracts]]
name = "Paper must not import broker"
type = "forbidden"
source_modules = ["bithumb_bot.paper"]
forbidden_modules = ["bithumb_bot.broker"]
