# Pre-commit configuration.
#
# Active hooks:
#   - ruff (lint)
#   - ruff-format
#   - mypy (via local system entry)
#   - decimal-float-literal-check   # wired by plan 01-02 task 01-02-03 (D-49/D-72)
#
# Placeholder (inert) hooks — wired to functional entries later:
#   - import-linter                 # wired by plan 01-03 task 01-03-03
#
# The remaining placeholder id (`import-linter`) intentionally exists NOW so
# the id is reserved and every downstream commit surface already knows its
# name before its entry becomes functional. It uses `entry: true` (a no-op
# shell builtin), `always_run: false`, and `pass_filenames: false` so it is
# inert and cannot mask a real violation before its real implementation lands.
#
# ---------------------------------------------------------------------------
# CI wiring note for `decimal-float-literal-check` (D-73)
# ---------------------------------------------------------------------------
# Pre-commit alone is not enforcement — a developer can `git commit --no-verify`
# past it. CI MUST re-run the same check across every tracked `.py` file so
# there is no path around the D-49 constraint. The exact command CI SHALL
# execute (choose whichever CI provider the operator later configures) is:
#
#   python -m tools.decimal_ast_check \
#       $(git ls-files '*.py' | grep -Ev '^tests/tools/decimal_ast/(positive|nested|syntax_error)/')
#
# The `grep -Ev` filter mirrors the `exclude:` regex in the hook definition
# below so the intentional-violation fixture files stay out of both surfaces.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: ["src"]

      # ---------------------------------------------------------------------
      # Functional decimal-from-float AST checker (D-49, D-72).
      # Wired here by plan 01-02 task 01-02-03. See top-of-file CI note.
      # ---------------------------------------------------------------------
      - id: decimal-float-literal-check
        name: reject Decimal() constructed from a float/complex literal
        entry: python -m tools.decimal_ast_check
        language: system
        files: \.py$
        exclude: ^tests/tools/decimal_ast/(positive|nested|syntax_error)/
        pass_filenames: true

      # ---------------------------------------------------------------------
      # PLACEHOLDER — inert hook. Wired to a functional entry by
      # plan 01-03 task 01-03-03 (lint-imports).
      # DO NOT change `entry` here — plan 01-03 owns that swap.
      # ---------------------------------------------------------------------
      - id: import-linter  # wired by plan 01-03
        name: import-linter (core must not import broker) — placeholder (wired by plan 01-03)
        entry: "true"
        language: system
        pass_filenames: false
        always_run: false
        files: '^$'
