# Pre-commit configuration.
#
# Active hooks:
#   - ruff (lint)
#   - ruff-format
#   - mypy (via local system entry)
#   - decimal-float-literal-check   # wired by plan 01-02 task 01-02-03 (D-49/D-72)
#   - import-linter                 # wired by plan 01-03 task 01-03-03 (D-71/D-73)
#
# ---------------------------------------------------------------------------
# CI wiring — the single documented quality-command form (D-73, D-71)
# ---------------------------------------------------------------------------
# Pre-commit alone is not enforcement — a developer can `git commit --no-verify`
# past it. CI MUST re-run the same checks so there is no path around the
# D-49 / D-71 constraints. The exact command CI SHALL execute (choose
# whichever CI provider the operator later configures) is the composed
# single-line quality-command form that matches VALIDATION.md's static gate:
#
#   uv run lint-imports && \
#     uv run python -m tools.decimal_ast_check \
#       $(git ls-files '*.py' | grep -Ev '^tests/tools/decimal_ast/(positive|nested|syntax_error)/')
#
# The `grep -Ev` filter mirrors the `exclude:` regex in the
# `decimal-float-literal-check` hook definition below so the
# intentional-violation fixture files stay out of both surfaces.
# `lint-imports` requires `import-linter` to be installed AND the whole
# project (root_package = "bithumb_bot") to be importable from the active
# environment — that is why the `import-linter` hook below uses
# `language: system, pass_filenames: false, always_run: true` (Finding 1).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: ["src"]

      # ---------------------------------------------------------------------
      # Functional decimal-from-float AST checker (D-49, D-72).
      # Wired here by plan 01-02 task 01-02-03. See top-of-file CI note.
      # ---------------------------------------------------------------------
      - id: decimal-float-literal-check
        name: reject Decimal() constructed from a float/complex literal
        entry: python -m tools.decimal_ast_check
        language: system
        files: \.py$
        exclude: ^tests/tools/decimal_ast/(positive|nested|syntax_error)/
        pass_filenames: true

      # ---------------------------------------------------------------------
      # Functional Import Linter contract enforcement (D-71 / D-73).
      # Wired here by plan 01-03 task 01-03-03. See top-of-file CI note.
      #
      # `language: system` — the checker needs the WHOLE project importable
      # (grimp inspects the real module graph), not a per-file isolated env
      # (Finding 1).
      # `pass_filenames: false` + `always_run: true` — contract violation is
      # a whole-project property; running on a subset of changed files would
      # let a violation slip in via an unrelated commit.
      # ---------------------------------------------------------------------
      - id: import-linter
        name: import-linter (core must not import broker)
        entry: lint-imports
        language: system
        pass_filenames: false
        always_run: true
