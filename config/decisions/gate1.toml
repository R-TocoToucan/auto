# -----------------------------------------------------------------------------
# D-40 — Gate-1 frozen M1 read-only HTTP behavior
#
# These values apply ONLY to the M1 spec-fetch HTTP client. They MUST NOT be
# reused implicitly by the protective-exit path (which has its own Gate-2
# operational fields, D-41). Retry semantics: network errors, connect/read
# timeouts, HTTP 408, HTTP 429 per Retry-After when valid, and retryable 5xx
# (500/502/503/504). Do NOT retry non-retryable 4xx (400/401/403/422/etc).
# -----------------------------------------------------------------------------
m1_spec_http_connect_timeout_ms = 5000
m1_spec_http_read_timeout_ms = 15000
m1_spec_http_max_attempts = 3
m1_spec_http_backoff_initial_ms = 500
m1_spec_http_backoff_cap_ms = 5000
m1_spec_http_jitter = "full"


