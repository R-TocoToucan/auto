# any strategy evaluation / selection / holdout (D-89).
#
# `provisional_engineering_notional_krw = "100000"` (100_000 KRW) is a
# TEST-FIXTURE-ONLY value. NEVER a validated cap. NEVER used for strategy
# evaluation. NEVER carried into holdout. Preregistered hypothetical
# calibration grids may reference it; strategy returns / benchmarks /
# selection MUST NOT (D-12).
# -----------------------------------------------------------------------------
max_validated_notional_krw = { value = "unset", frozen_at = "gate2", frozen_at_phase = 3 }
