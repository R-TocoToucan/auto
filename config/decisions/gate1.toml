# =============================================================================
# Gate-1 Decision Register — frozen
#
# This file records the FROZEN Gate-1 decisions from
# `.planning/phases/01-safety-foundation-bithumb-spec-adapter/01-CONTEXT.md`
# (§ Implementation Decisions, D-01…D-100). It is PUBLIC configuration:
# no secrets, no credentials, no absolute filesystem paths (D-57).
#
# Loading contract (D-58, D-60, D-61, D-62):
#   * Parsed via stdlib `tomllib` in BINARY mode (`open(path, "rb")`)
#   * Validated through frozen pydantic v2 `Gate1Decisions`
#   * File-bytes SHA-256 is the per-gate provenance hash (feeds config_hash)
#   * `status = "frozen"` is a hard precondition; any other value → fail closed
#
# --- On null / value-deferred fields ---
#   TOML 1.0.0 (which stdlib `tomllib` implements) has NO `null` literal.
#   Fields whose SCHEMA is frozen at Gate 1 but whose NUMERIC value is
#   deferred to Gate 2 (D-41) or Gate 3 (D-42) — plus D-09's
#   `max_validated_notional_krw` — are recorded here as inline tables:
#
#       max_validated_notional_krw = { value = "unset",
#                                      frozen_at = "gate2",
#                                      frozen_at_phase = 3 }
#
#   The pydantic `Gate1Decisions` loader recognises this `"unset"` sentinel
#   and normalises it to Python `None`, preserving the plan's semantic
#   intent (SCHEMA declared here + VALUE frozen later) while remaining
#   loadable by stdlib `tomllib` at Python 3.11. Every decimal-bearing
#   FROZEN-value field is a QUOTED STRING (D-49, Finding 3 `StrictDecimal`).
# =============================================================================


